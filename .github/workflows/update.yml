name: update-schedule
on:
  schedule: [{cron: "0 */3 * * *"}]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pdfplumber requests
      - run: python fetch_pdfs.py pdfs
      - run: python parse.py pdfs docs/data.json
      - run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add docs/data.json
          git diff --cached --quiet || (git commit -m "update schedule" && git push)
